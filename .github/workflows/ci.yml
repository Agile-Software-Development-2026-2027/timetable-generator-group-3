# CI: runs on every pull request and on every push to main.
# The job "test" is a required check on main: a pull request cannot be merged until it is green.
# Do not rename the job.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # lets you run CI by hand from the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Format check (ruff)
        run: ruff format --check app tests
      - name: Run backend tests
        env:
          DATABASE_URL: "sqlite:///./ci.db"
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install
      - name: Lint (eslint)
        run: npm run lint
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
